# Configuration de l'application (lue une fois au démarrage par AppConfig)

# LLM local (Ollama)
llm.url=http://localhost:11434
llm.model=qwen3.5:4b
llm.timeoutSeconds=90

# Routing
routing.threshold=0.4
routing.ambiguityMargin=0.1
routing.maxAttempts=3

# Contexte et historique envoyés au LLM
context.tokenBudget=1500
memory.maxHistoryEntries=6

# Emplacements
paths.agents=config/agents
paths.inbox=config/inbox